<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Menu-music audition: plays the candidate loops in audio/music/menu/ (listed in its
       candidates.json, written by tools/music/render.mjs) and can set one as the title piece
       of the debug game (?debug), through localStorage (js/engine/audio.js menuOverride). -->
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu music</title>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #0d0b14; --panel: #171424; --line: #2d2840; --text: #e8e4d9; --muted: #8b9bb4; --accent: #feae34; --accent-2: #2ce8f5; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body { font: 15px/1.5 system-ui, "Segoe UI", sans-serif; padding: 24px 16px 80px; }
    .wrap { max-width: 920px; margin: 0 auto; }
    h1 { font-size: 26px; margin: 0 0 4px; }
    .lede { color: var(--muted); margin: 0 0 18px; }
    a { color: var(--muted); }
    .bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; background: rgba(13, 11, 20, .95); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 16px; }
    .bar .now { flex: 1; min-width: 200px; }
    .bar strong { color: var(--accent); }
    label { color: var(--muted); font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
    .tune { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 12px 0; }
    .tune h2 { font-size: 18px; margin: 0; }
    .tune .meta { color: var(--muted); font-size: 13px; margin: 2px 0 8px; }
    .tune p { margin: 0 0 10px; }
    .cands { display: flex; flex-wrap: wrap; gap: 8px; }
    .cand { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: #1f1b2e; }
    .cand.playing { border-color: var(--accent-2); box-shadow: 0 0 0 1px var(--accent-2) inset; }
    .cand.inuse { border-color: var(--accent); }
    .cand .name { font-size: 14px; }
    .cand .size { color: var(--muted); font-size: 12px; }
    button { font: inherit; color: var(--text); background: #2a2540; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); color: #1b1408; border-color: var(--accent); font-weight: 600; }
    button[aria-pressed="true"] { background: var(--accent-2); color: #06202a; border-color: var(--accent-2); }
    .empty { color: var(--muted); padding: 24px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; }
    kbd { font: 12px/1 monospace; background: #2a2540; border: 1px solid var(--line); border-radius: 4px; padding: 2px 5px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Menu music</h1>
    <p class="lede">Guitar loops for the title screen and menus. Play one here (it loops), or <b>use it in the menus</b> and open the <a href="../../?debug">debug game</a> to hear it on the real title screen. The choice lives only in this browser.</p>
    <div class="bar">
      <div class="now" id="now">Nothing playing. Keys <kbd>1</kbd>–<kbd>9</kbd> play the first candidates, <kbd>Space</kbd> stops.</div>
      <label>Volume <input id="vol" type="range" min="0" max="1" step="0.01" value="0.6"></label>
      <button id="stop">Stop</button>
      <button id="clear" title="The menus play the listed title piece again">Clear menu choice</button>
    </div>
    <div id="list"><div class="empty">Loading candidates…</div></div>
  </div>
  <script src="music.js"></script>
</body>
</html>
