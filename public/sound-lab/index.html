<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <base href="../"><title>Weapon sounds · Forest Survivor</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="sound-lab/style.css">
</head>
<body><main>
  <header><nav><a href="./">Forest Survivor</a><a id="studio" href="field-studio/" hidden>Field Studio</a></nav>
    <h1>Weapon sounds</h1><p>Choose a weapon and listen to its attacks. Apply a sound to use it for that weapon in the game.</p></header>
  <section class="desk" aria-label="Weapon sound controls">
    <div class="weapon-choice"><label for="weapon">Weapon</label><select id="weapon"></select><p id="identity"></p></div>
    <div class="volume-choice"><label for="volume">Preview volume <output id="volume-value">55%</output></label>
      <input id="volume" type="range" min="0" max="100" value="55"></div>
  </section>
  <div class="workbench">
    <section class="library"><h2>Sound library</h2>
      <div class="filters"><label>Search <input type="search" id="search" placeholder="Title, instrument or artist"></label>
      <label>Show <select id="category"><option value="best">Suggested for this weapon</option><option value="all">All sounds</option><option value="styles">Game styles</option><option value="weapons-melee">Melee</option><option value="weapons-ranged">Ranged</option><option value="magic">Magic</option><option value="impacts">Impacts</option><option value="explosions">Explosions</option><option value="foley">Bells, coins and other foley</option></select></label></div>
      <label class="record-label" for="recording">Sound <span id="count"></span></label>
      <select id="recording" size="7" aria-label="Choose a weapon sound"></select>
      <div id="credit"></div><button id="apply" type="button">Apply to weapon</button><p role="status" id="saved"></p>
    </section>
    <section class="practice"><h2>Practice field</h2><p id="playing"></p>
      <canvas id="arena" width="560" height="292" aria-label="Live practice with the selected weapon and training targets"></canvas>
      <div id="levels" aria-label="Choose attack to play"></div>
      <div class="transport"><span id="timer" aria-live="off">Ready</span><button id="stop" type="button">Stop</button></div>
      <p id="stats">Choose a rank to start the eight-second audition.</p>
    </section>
  </div>
</main><script type="module" src="sound-lab/audition.js"></script></body></html>
