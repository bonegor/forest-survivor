<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Hero sprite review · Forest Survivor</title>
<link rel="stylesheet" href="./review.css">
<main>
  <header><span class="eyebrow">Forest Survivor · Hero workshop</span><h1>Choose their next look.</h1>
    <p>Eight heroes. Two new options each. Compare every proposal with its retained baseline and the Plumed Knight.</p></header>
  <details id="saved-choices" open><summary id="saved-count">Saved choices</summary><ul id="saved-list"></ul></details>
  <nav aria-label="Preview controls">
    <label>Hero <select id="hero"></select></label>
    <label>Motion <select id="motion"><option value="cycle">Full demonstration</option><option value="idle">Idle</option><option value="walk">Walk / hover</option><option value="attack">Attack</option></select></label>
    <label>Facing <select id="facing"><option value="auto">Both directions</option><option value="1">Right</option><option value="-1">Left</option></select></label>
    <button id="pause">Pause</button><button id="slow">Slow motion</button><button id="step">Step one frame</button><button id="restart">Restart loop</button>
  </nav>
  <p class="baseline-note" id="baseline-note"></p>
  <div class="cards" id="cards"></div>
  <footer><a href="../">Return to the game</a><span>Plumed Knight is unchanged. Shadow floats in every movement view.</span></footer>
  <p id="status" role="status"></p>
</main>
<script type="module" src="./review.js"></script>
</html>
