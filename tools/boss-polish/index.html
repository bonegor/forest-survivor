<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boss art comparison</title>
<style>body{background:#11191d;color:#eee2c9;font:15px system-ui;margin:24px}main{max-width:1500px;margin:auto}h1{font:30px Georgia}p{color:#b4c0c7}nav{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}button,select{font:inherit;color:#eee2c9;background:#26323b;border:1px solid #54636d;padding:9px;border-radius:5px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}iframe{border:0;width:100%;height:650px;background:#0c1216}h2{font:20px Georgia}@media(max-width:900px){.pair{grid-template-columns:1fr}}</style>
<main><h1>Forest Survivor · Boss art</h1><p>Before and after in the real game. Tour covers rest, travel, attacks and recovery in both directions. This preview uses disposable profiles.</p><nav><select id="boss" aria-label="Boss"></select><select id="action" aria-label="Action"><option>tour</option></select><button id="face">Reverse facing</button><button id="pause">Pause</button><button id="step">One frame</button><button id="reset">Restart</button></nav><div class="pair"><section><h2>Before</h2><iframe title="Before boss art" id="before"></iframe></section><section><h2>Updated</h2><iframe title="Updated boss art" id="after"></iframe></section></div></main>
<script type="module">
import{BOSS_IDS}from'/boss-scene.js';
const boss=document.querySelector('#boss'),action=document.querySelector('#action'),frames=['before','after'].map(id=>document.getElementById(id));
const names={boneking:'Ossarian · Bone King',butcher:'Grimgut · Butcher',lich:'Malgrath · Lich',demonlord:'Azgaroth · Demon Lord',pharaoh:'Pharaoh',frostgiant:'Frost Giant',thornqueen:'Thorn Queen',pitlord:'Pit Lord',eanasir:'Ea-nāṣir',skeletonarcher:'Crypt Lord · Archer',skeletonmage:'Crypt Lord · Mage'};
for(const id of BOSS_IDS)boss.add(new Option(names[id],id));
boss.value=new URLSearchParams(location.search).get('boss')||'boneking';let ready=new Set(),paused=false;
const send=(cmd,value)=>frames.forEach(f=>f.contentWindow.postMessage({bossReview:true,cmd,value},location.origin));
function load(){ready.clear();for(const f of frames)f.src=`/viewer.html?variant=${f.id}&boss=${boss.value}`;}
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data.bossHeight){const frame=frames.find(f=>f.contentWindow===e.source);if(frame)frame.style.height=`${e.data.bossHeight+12}px`;return;}if(!e.data.bossReady)return;ready.add(e.data.variant);if(e.data.variant==='after'){action.innerHTML='';for(const a of['tour',...e.data.sequence])action.add(new Option(a,a));}if(ready.size===2){send('reset');send('pause',paused);}});
boss.onchange=load;action.onchange=()=>send('action',action.value);
document.querySelector('#face').onclick=()=>send('face');document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause';send('pause',paused);};document.querySelector('#step').onclick=()=>{paused=true;document.querySelector('#pause').textContent='Play';send('step');};document.querySelector('#reset').onclick=()=>{action.value='tour';send('reset');};load();
let last=performance.now();function loop(now){const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;if(ready.size===2)send('tick',dt);requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script></html>
